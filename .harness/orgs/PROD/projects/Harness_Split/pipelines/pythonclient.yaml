pipeline:
  name: python-client
  identifier: pythonclient
  projectIdentifier: Harness_Split
  orgIdentifier: PROD
  tags:
    ai_generated: "true"
  properties:
    ci:
      codebase:
        connectorRef: <+input>
        repoName: <+input>
        build: <+input>
  variables:
    - name: sonarqube_token
      type: Secret
      value: <+secrets.getValue('sonarqube-token')>
    - name: github_token
      type: Secret
      value: <+secrets.getValue('github-devops-token')>
  stages:
    - stage:
        name: Build and Test
        identifier: ci_stage
        type: CI
        spec:
          cloneCodebase: true
          runtime:
            type: Cloud
            spec:
              size: medium
              nestedVirtualization: true
          platform:
            os: Linux
            arch: Amd64
          execution:
            steps:
              - step:
                  type: Sonarqube
                  name: Sonarqube
                  identifier: Sonarqube
                  spec:
                    mode: orchestration
                    config: default
                    target:
                      type: repository
                      detection: auto
                    advanced:
                      log:
                        level: info
                    auth:
                      access_token: <+secrets.getValue("sonarqube-token")>
                      domain: https://sonar.harness.io/
                      ssl: true
              - step:
                  timeout: 30m
                  type: Test
                  name: Run Python Tests
                  identifier: run_tests
                  spec:
                    connectorRef: account.harnessImage
                    image: python:3.7.16-alpine
                    shell: Sh
                    command: |-
                      apk update
                      apk add --no-cache krb5-dev musl-dev libffi-dev build-base

                      # Run pytest with JUnit XML report output
                      cd /harness
                      pip install --upgrade pip
                      pip install -U setuptools pip wheel
                      pip install Cython==3.0.12
                      pip install aiohttp==3.8.4
                      pip install cryptography==45.0.7
                      pip install pycparser==2.21

                      apk add redis 
                      redis-server /etc/redis.conf &

                      pip install redis==5.0.8
                      python setup.py test 
                    envVariables:
                      PYTHONPATH: ${PYTHONPATH}:.
                      PYTEST_ADDOPTS: "--verbose"
          rollbackSteps: []
          caching:
            enabled: false
            paths: []
          buildIntelligence:
            enabled: false
        description: ""
  description: This pipeline was updated by Harness AI on 2026-02-03 04:38:30 UTC by Bilal Al-Shahwany.
