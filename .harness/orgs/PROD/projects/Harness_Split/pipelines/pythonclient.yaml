pipeline:
  name: python-client
  identifier: pythonclient
  projectIdentifier: Harness_Split
  orgIdentifier: PROD
  tags:
    ai_generated: "true"
  properties:
    ci:
      codebase:
        connectorRef: <+input>
        repoName: <+input>
        build: <+input>
  variables:
    - name: sonarqube_token
      type: Secret
      value: <+secrets.getValue('sonarqube-token')>
    - name: github_token
      type: Secret
      value: <+secrets.getValue('github-devops-token')>
  stages:
    - stage:
        name: Build and Test
        identifier: ci_stage
        type: CI
        spec:
          cloneCodebase: true
          runtime:
            type: Cloud
            spec:
              size: small
              nestedVirtualization: true
          platform:
            os: Linux
            arch: Amd64
          serviceDependencies:
            - type: Service
              identifier: redis
              name: Redis
              spec:
                image: redis:latest
          execution:
            steps:
              - step:
                  type: Run
                  name: Verify Python Installation
                  identifier: verify_python
                  spec:
                    connectorRef: account.harnessImage
                    image: python:3.7.16-alpine
                    shell: Sh
                    command: |-
                      # Python is already installed in this image
                      python --version
                      pip --version

                      # Install any additional system packages if needed
                      apk update
                      apk add --no-cache gcc musl-dev libffi-dev
                    outputVariables:
                      - name: PYTHON_VERSION
                  timeout: 2m
              - step:
                  type: Run
                  name: Install System Dependencies
                  identifier: install_system_dependencies
                  spec:
                    connectorRef: account.harnessImage
                    image: python:3.7.16-alpine
                    shell: Sh
                    command: |-
                      # Update package lists
                      apk update

                      # Install libkrb5-dev package
                      apk add --no-cache krb5-dev musl-dev libffi-dev build-base python3-dev
                      gcc -v
                  timeout: 10m
              - step:
                  type: Run
                  name: Install Python Dependencies
                  identifier: install_python_dependencies
                  spec:
                    connectorRef: account.harnessImage
                    image: python:3.7.16-alpine
                    shell: Sh
                    command: |-
                      # Upgrade pip
                      pip install --upgrade pip

                      pip install -U setuptools pip wheel

                      echo "Python dependencies installed successfully"
                  timeout: 10m
              - step:
                  type: Test
                  name: Run Python Tests
                  identifier: run_tests
                  timeout: 10m
                  spec:
                    connectorRef: account.harnessImage
                    image: python:3.7.16-alpine
                    shell: Sh
                    command: |-
                      apk add --no-cache krb5-dev musl-dev libffi-dev build-base python3-dev

                      # Run pytest with JUnit XML report output
                      cd /harness
                      pip install aiohttp==3.8.4
                      pip install cryptography==45.0.7
                      pip install pycparser==2.21
                      python setup.py test 
                    envVariables:
                      PYTHONPATH: ${PYTHONPATH}:.
                      PYTEST_ADDOPTS: "--verbose"
              - step:
                  type: Run
                  name: Extract Version
                  identifier: extract_version
                  spec:
                    connectorRef: account.harnessImage
                    image: python:3.7.16-alpine
                    shell: Python
                    command: |
                      import os
                      import re

                      # Read the version.py file
                      with open('splitio/version.py', 'r') as file:
                          content = file.read()

                      # Extract version using regex
                      version_match = re.search(r'__version__\s*=\s*["\']([^"\']*)["\']\'', content)
                      if version_match:
                          version = version_match.group(1)
                          print(f"Extracted version: {version}")
                          # Export as environment variable for output
                          os.environ["VERSION"] = version
                      else:
                          print("Version not found in version.py file")
                          os.environ["VERSION"] = "not_found"
                    outputVariables:
                      - name: VERSION
                  timeout: 10m
              - step:
                  identifier: sonarqube_scan
                  name: SonarQube Scan
                  type: Sonarqube
                  timeout: 10m
                  spec:
                    mode: orchestration
                    config: default
                    target:
                      type: repository
                      detection: auto
                    auth:
                      access_token: <+pipeline.variables.sonarqube_token>
                    tool:
                      project_key: <+codebase.repoName>
                      branch_name: <+codebase.branch>
                      pull_request_key: <+codebase.prNumber>
                      pull_request_branch: <+codebase.targetBranch>
                      pull_request_base: <+codebase.sourceBranch>
                    settings:
                      sonar.host.url: <+pipeline.variables.sonarqube_host>
                      sonar.qualitygate.wait: true
                      sonar.branch.name: <+codebase.branch>
                      sonar.pullrequest.key: <+codebase.prNumber>
                      sonar.pullrequest.branch: <+codebase.targetBranch>
                      sonar.pullrequest.base: <+codebase.sourceBranch>
                  strategy:
                    when: <+codebase.prNumber != "">
                    matrix:
                      config:
                        - default
                        - branch-scan
            rollbackSteps: []
          caching:
            enabled: false
            paths: []
          buildIntelligence:
            enabled: false
        description: ""
  description: This pipeline was updated by Harness AI on 2026-02-03 04:38:30 UTC by Bilal Al-Shahwany.
